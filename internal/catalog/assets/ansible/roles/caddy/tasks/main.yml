---
# Caddy depuis le dépôt officiel Cloudsmith, en `deb822_repository` plutôt
# qu'en `curl | gpg --dearmor` à la main — même idiome que le rôle `docker`.
# python3-debian n'est pas décoratif : c'est ce dont deb822_repository a
# besoin côté invité pour écrire un dépôt au format moderne.
- name: Installer les prérequis du dépôt Caddy
  ansible.builtin.apt:
    name:
      - ca-certificates
      - apt-transport-https
      - curl
      - gpg
      - debian-keyring
      - debian-archive-keyring
      - python3-debian
    state: present
    update_cache: true

- name: Créer le dossier des clés de dépôt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# force: false — sans lui, get_url refait la requête à chaque passage et peut
# rapporter « changed » selon ce que le serveur répond sur les en-têtes de
# cache. L'idempotence est mesurée ici, pas supposée.
- name: Poser la clé du dépôt Caddy
  ansible.builtin.get_url:
    url: "{{ pvecli_caddy_gpg_url }}"
    dest: "{{ pvecli_caddy_keyring }}"
    mode: "0644"
    force: false

# edge-01 a reçu ce dépôt à la main, écrit dans ce fichier. Le laisser à côté
# du dépôt déclaré ci-dessous ferait apparaître Caddy deux fois dans les
# sources d'apt, et « apt update » avertirait « configured multiple times ».
# Le supprimer est ce qui fait converger edge-01 vers l'état d'une VM neuve.
- name: Retirer le dépôt Caddy posé à la main (convergence avec une install fraîche)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/caddy-stable.list
    state: absent

- name: Déclarer le dépôt Caddy
  ansible.builtin.deb822_repository:
    name: caddy
    types: [deb]
    uris: "{{ pvecli_caddy_repo_uri }}"
    suites: "{{ pvecli_caddy_repo_suite }}"
    components: [main]
    signed_by: "{{ pvecli_caddy_keyring }}"
    enabled: true
    state: present

- name: Installer Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Créer le dossier des fragments de route
  ansible.builtin.file:
    path: "{{ pvecli_caddy_conf_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

# `validate` porte sur le fichier CANDIDAT, avant qu'il ne remplace celui en
# place : un Caddyfile cassé n'est donc jamais écrit et jamais rechargé, et le
# proxy en service pour tous les projets reste debout.
- name: Déployer le Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: "caddy validate --adapter caddyfile --config %s"
  notify: Recharger Caddy

# Cette tâche vient AVANT toute tâche DE CE RÔLE capable de démarrer ou
# redémarrer le proxy, et c'est délibéré. Le seul démarrage qui puisse la
# précéder n'est pas une tâche : c'est le `postinst` du paquet Caddy, qui fait
# lui-même `deb-systemd-helper enable` puis `deb-systemd-invoke start
# caddy.service` (constaté sur edge-01 dans /var/lib/dpkg/info/caddy.postinst).
# Sur un hôte neuf, « Installer Caddy » démarre donc le proxy avant tout
# Caddyfile de rôle — mais avec celui du paquet, valide et sans `import
# conf.d/`, donc sans pouvoir buter sur un fragment de projet : inoffensif.
# Le `validate` de la tâche précédente n'est joué
# par le module `template` que si le contenu rendu diffère de celui sur
# disque (ansible/modules/copy.py : `if checksum_src != checksum_dest ... if
# validate:`) : sur un hôte déjà convergé il ne tourne pas du tout. Or ce qui
# pourrit réellement, ce n'est pas le Caddyfile — c'est conf.d/, écrit par
# les déploiements de projets, hors de ce rôle. Scénario réel : un run écrit
# le Caddyfile puis est interrompu avant son handler (coupure SSH), un projet
# dépose ensuite un fragment cassé, et au run suivant le template est
# inchangé donc non validé. Si un restart pouvait se produire à ce moment,
# Caddy relirait le disque, refuserait le fragment et ne redémarrerait pas :
# le proxy partagé de tout le labo tomberait. En plaçant la revalidation ici,
# un échec arrête le play AVANT le démarrage, avant la sonde et avant les
# handlers — la garantie « rien ne touche au proxy tant que la configuration
# entière, fragments compris, n'a pas été validée » devient structurelle et
# ne dépend plus de l'état d'arrivée de l'hôte.
- name: Revalider la configuration complète, fragments compris
  ansible.builtin.command:
    cmd: caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
  changed_when: false

# `caddy validate` n'est PAS une analyse syntaxique : il PROVISIONNE les
# modules de la configuration. Un fragment qui déclare « log { output file
# /var/log/caddy/x.log } » fait donc ouvrir — et créer — ce fichier par la
# validation elle-même. Or ce rôle tourne en `become: true` : le fichier naît
# root:root 0600, et le service, qui tourne sous l'utilisateur `caddy`, ne peut
# plus l'ouvrir. Le reload échoue, et surtout le prochain DÉMARRAGE échoue —
# c'est-à-dire que la tâche censée protéger le proxy est celle qui le casse.
#
# Constaté en vrai sur edge-01 le 03-08-2026, à la main : « caddy validate »
# lancé en root, puis « systemctl reload caddy » → « open
# /var/log/caddy/hardware-fr.log: permission denied ». Le service est resté
# debout uniquement parce qu'un reload raté conserve l'ancienne configuration.
#
# Rendre les journaux à `caddy` ici, APRÈS la validation et AVANT toute tâche
# capable de démarrer le service, referme le trou quel que soit le fragment
# déposé — sans que le rôle ait à connaître les chemins qu'un projet choisit.
# Valider sous `caddy` plutôt que corriger après serait plus direct, mais le
# fichier candidat du module `template` n'est lisible que par root : la
# validation ne peut pas changer d'utilisateur sans cesser de valider.
- name: Rendre à Caddy les journaux que la validation a pu créer en root
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"
    recurse: true

- name: Démarrer Caddy au boot
  ansible.builtin.systemd_service:
    name: caddy
    state: started
    enabled: true

# Le Caddyfile sur disque porte déjà `admin 127.0.0.1:2019`, mais le processus
# en cours d'exécution a été démarré — potentiellement avant ce rôle, comme
# sur edge-01 — sous un ancien `admin off` : il n'expose alors aucun socket
# admin. Or `caddy reload` est lui-même un client de l'API admin : il ne peut
# jamais être ce qui *crée* le point d'entrée dont il a besoin pour parler à
# l'instance. La seule question qui compte est donc : cette instance
# répond-elle sur l'admin API, oui ou non ? Ce n'est délibérément PAS un
# « reload, et si ça échoue on restart » : un reload échoue aussi quand un
# fragment de projet est syntaxiquement valide mais sémantiquement refusé par
# Caddy, et redémarrer dans ce cas couperait les connexions de tous les
# projets pour, au final, échouer quand même. La sonde distingue « je ne peux
# pas parler à l'instance » de « l'instance a refusé cette config » — seul le
# premier cas justifie un restart.
#
# La sonde est une commande explicite en `failed_when: false` plutôt qu'un
# `block`/`rescue` autour de `wait_for` : un `rescue:` attrape N'IMPORTE
# QUELLE défaillance du bloc (module absent, argument invalide, interpréteur
# Python cassé) et redémarrerait un proxy mutualisé sans avoir rien prouvé.
# Pour la même raison, le restart n'est PAS branché sur `rc != 0` : ce test
# agrège des faits différents. `rc == 7` (« Failed to connect to host ») est
# le seul qui PROUVE l'absence d'écouteur sur 127.0.0.1:2019, donc le seul
# branché ici. Les autres échecs de la sonde ne redémarrent délibérément
# rien : `rc == 2` (curl absent ou non exécutable — le rôle l'installe en
# première tâche, mais un run `--tags` peut sauter cette tâche, et
# `failed_when: false` rend alors un résultat non-`failed` qui déclencherait
# quand même la dépendance), `rc == 28` (dépassement de `--max-time`, donc
# une instance lente, pas une instance absente), et tout code obtenu en
# passant par un proxy hérité de l'environnement. « la sonde a échoué » n'est
# pas « l'instance ne répond pas ». `--noproxy '*'` neutralise justement
# `http_proxy`/`all_proxy` : `command` ne passe pas par un shell mais fait un
# `shlex.split`, l'argument arrive donc littéralement `*`, sans glob.
# Le test porte sur `rc` et pas sur `failed` : `failed_when: false` écrase
# `failed` dans le résultat, un `when:` qui le testerait ne se déclencherait
# jamais et la tâche serait décorative.
#
# La sonde ne cible que `127.0.0.1` parce que le Caddyfile fixe l'endpoint
# là : mesuré sur edge-01, l'admin API ne bindait que la loopback IPv4 (même
# en résolvant « localhost »), donc une jambe `::1` aurait échoué à chaque
# passage et redémarré Caddy à chaque exécution — une rupture d'idempotence
# pire que le bug d'origine. Le coût de la transition `admin off` → `admin
# 127.0.0.1:2019` est ainsi payé une seule fois : au run suivant la sonde
# trouve le socket, le restart est sauté, et `--idempotence` reste à
# `changed=0`.
- name: Sonder si l'instance Caddy en cours expose son admin API
  ansible.builtin.command:
    cmd: curl --silent --show-error --noproxy '*' --max-time 2 --output /dev/null http://127.0.0.1:2019/config/
  register: pvecli_caddy_admin_probe
  changed_when: false
  failed_when: false

- name: Redémarrer Caddy pour faire naître l'admin API (transition admin off → admin 127.0.0.1:2019)
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted
  when: pvecli_caddy_admin_probe.rc == 7

- name: Relire la version réellement installée
  ansible.builtin.command:
    cmd: caddy version
  register: pvecli_caddy_installed
  changed_when: false

# « caddy version » affiche « v2.11.4 h1:XKxk… » — le premier mot est le
# numéro de version, le reste est un hash de build sans intérêt ici.
- name: Extraire le numéro de version
  ansible.builtin.set_fact:
    pvecli_caddy_version: "{{ pvecli_caddy_installed.stdout.split(' ')[0] }}"

- name: Publier les sorties
  ansible.builtin.include_role:
    name: pvecli_publish
  vars:
    pvecli_publish_service: caddy
    pvecli_publish_values:
      caddy: "{{ pvecli_caddy_version }}"
      caddy.conf_dir: "{{ pvecli_caddy_conf_dir }}"
